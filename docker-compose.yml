services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_dbms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Full-stack profile: `docker compose --profile app up --build`
  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/llm_dbms
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URI: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        # Same-origin through nginx so the auth cookie is first-party.
        REACT_APP_API_URL: /api
    profiles: ["app"]
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
