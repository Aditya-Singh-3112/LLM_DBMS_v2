server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every path serves index.html
    location / {
        try_files $uri /index.html;
    }

    # Metrics are for the monitoring network, not the browser.
    location = /api/metrics {
        return 404;
    }

    # Same-origin API so the refresh cookie is first-party (SameSite=Lax).
    location /api/ {
        proxy_pass http://api:8000/;
        # The API scopes its refresh cookie to /auth; rewrite so the browser
        # sends it back on /api/auth/*.
        proxy_cookie_path /auth /api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;   # needed for the SSE /ask/stream endpoint
        proxy_read_timeout 300s;
    }
}
